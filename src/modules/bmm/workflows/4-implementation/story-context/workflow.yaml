# Story Context Creation Workflow
name: story-context
description: "Assemble a dynamic Story Context XML by pulling latest documentation and existing code/library artifacts relevant to a drafted story"
author: "BMad"

# Critical variables
config_source: "{project-root}/bmad/bmm/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
user_skill_level: "{config_source}:user_skill_level"
date: system-generated

# Workflow components
installed_path: "{project-root}/bmad/bmm/workflows/4-implementation/story-context"
template: "{installed_path}/context-template.xml"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"

# Variables and inputs
variables:
  story_path: "" # Explicit story path; auto-discovered if empty
  auto_update_status: false
  story_dir: "{config_source}:dev_story_location"
  story_selection_limit: 10
  tech_spec_search_dir: "{project-root}/docs"
  tech_spec_glob_template: "tech-spec-epic-{{epic_id}}*.md"
  non_interactive: true
  epic_context_dir: "{config_source}:dev_story_location"
  epic_context_workflow: "{project-root}/bmad/bmm/workflows/4-implementation/epic-context/workflow.yaml"
  auto_refresh_epic_context: true
  block_until_fresh: true
  epic_context_lock_timeout_seconds: 120

# Output configuration
default_output_file: "{story_dir}/story-context-{{epic_id}}.{{story_id}}.xml"

# Recommended inputs
recommended_inputs:
  - story_markdown: "Path to a story markdown file to build context for"

required_tools:
  - list_files
  - file_info
  - read_file
  - write_file
  - create_directory
  - glob
  - search_repo
  - parse_markdown
  - parse_xml
  - hash_file

web_bundle: false

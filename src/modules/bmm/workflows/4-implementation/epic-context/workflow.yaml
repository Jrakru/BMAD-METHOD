# Epic Context Workflow
name: epic-context
description: "Build and maintain an epic-level context spine consumed by story-context"
author: "BMad"

# Core configuration
config_source: "{project-root}/bmad/bmm/config.yaml"
output_folder: "{config_source}:output_folder"
story_dir: "{config_source}:dev_story_location"
tech_docs_root: "{config_source}:tech_docs"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/bmad/bmm/workflows/4-implementation/epic-context"
xml_template: "{installed_path}/templates/epic-context.xml"
md_template: "{installed_path}/templates/epic-context.md"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"

# Variables and inputs
variables:
  epic_id: ""                  # Required epic number (e.g. "1"); derive automatically when run by story-context
  run_mode: "auto"             # auto | build | refresh | consult | interactive
  target_story_id: ""          # Optional story id (e.g. "1.3") to mark consulted during consult mode
  story_title: ""              # Optional story title for consult updates
  force_refresh: false         # When true, rebuild spine even if hashes match
  non_interactive: true        # Story-context sets true; manual runs can switch to false for prompts

# Output configuration
xml_output: "{story_dir}/epic-context-{{epic_id}}.xml"
md_output: "{story_dir}/epic-context-{{epic_id}}.md"
lock_file: "{story_dir}/epic-context-{{epic_id}}.lock"

# Required tools
required_tools:
  - list_files
  - file_info
  - read_file
  - write_file
  - create_directory
  - glob
  - search_repo
  - hash_file
  - parse_markdown

tags:
  - context
  - epic
  - planning
  - bmad-v6

execution_hints:
  interactive: false
  autonomous: true
  iterative: true

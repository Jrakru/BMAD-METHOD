name: impact-summary
description: "Create a stakeholder-ready summary of architecture and data-flow impacts for a proposed change, grounded in code_tools findings and 1C4D5 assets."
author: "BMAD Architecture Team"

# Critical variables from config
config_source: "{project-root}/bmad/bmm/config.yaml"
project_name: "{config_source}:project_name"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/bmad/bmm/workflows/1c4d5/impact-summary"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"

variables:
  architecture_workspace: "{config_source}:architecture_workspace"
  c4d5_reference: "{config_source}:c4d5_reference_library"
  likec4_model_dir: "{architecture_workspace}/likec4/model"
  docs_dir: "{architecture_workspace}/docs"
  summary_output_dir: "{output_folder}/1c4d5"
  code_tools_script: "{project-root}/scripts/run_code_tools_summary.py"

default_output_file: "{summary_output_dir}/architecture-impact-{{date}}.md"

required_tools:
  - code_tools
  - shell_command
  - list_files
  - read_file
  - write_file

tags:
  - architecture
  - impact-analysis
  - c4
  - d5
  - reporting
  - bmad-v6

execution_hints:
  interactive: true
  autonomous: false
  iterative: true

web_bundle: false
